name: Nightly

# Builds a release APK and publishes it to the rolling "nightly" pre-release.
# Runs every night (only if there are new commits), on push to the default branch, and manually.
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC
  push:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if nothing changed since the last nightly"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    # Only the default branch publishes nightlies.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: changes
        run: |
          last=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          echo "last nightly: ${last:-none}, head: $GITHUB_SHA"
          if [ "$last" = "$GITHUB_SHA" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.changes.outputs.skip != 'true'

      - name: Prepare signing key (optional)
        if: steps.changes.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "SIGNING_KEYSTORE_PASSWORD=$KS_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KS_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KS_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "No signing secrets: using the shared dev key from ci/"
          fi

      - name: Build release APK
        if: steps.changes.outputs.skip != 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_SUFFIX="nightly.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> "$GITHUB_ENV"
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/StabCam-$VERSION_SUFFIX.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish nightly pre-release
        if: steps.changes.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          git push origin :refs/tags/nightly || true
          {
            echo "Автоматическая ночная сборка \`$VERSION_SUFFIX\`."
            echo
            echo "Коммит: $GITHUB_SHA"
            echo
            echo "**Последние изменения:**"
            git log -10 --pretty='- %s (%h)'
          } > notes.md
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes-file notes.md

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.skip != 'true'
        with:
          name: stabcam-nightly
          path: dist/*
          retention-days: 30
